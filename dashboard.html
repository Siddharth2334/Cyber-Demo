<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚨 Cyber Security Live Attack Dashboard</title>
    <style>
        body { font-family: monospace; background-color: #0d1117; color: #58a6ff; padding: 20px; }
        .dashboard-container { max-width: 800px; margin: 0 auto; background: #161b22; padding: 30px; border: 1px solid #30363d; border-radius: 6px; }
        h1 { color: #f0883e; border-bottom: 1px solid #30363d; padding-bottom: 10px; margin-top: 0; }
        .log-entry { background: #0d1117; padding: 12px; margin: 8px 0; border-left: 4px solid #da3633; color: #c9d1d9; font-size: 16px; border-radius: 0 4px 4px 0; }
        .timestamp { color: #8b949e; margin-right: 15px; }
        .highlight { color: #58a6ff; font-weight: bold; }
        .status { color: #56d364; font-weight: bold; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <h1>🏴‍☠️ Attacker Infiltration Console (Live Feed)</h1>
        <div class="status">● LISTENING FOR INCOMING CONNECTIONS FROM CLASSROOM...</div>
        <div id="logWindow">
            <p style="color:#8b949e;">Waiting for students to scan QR code and interact...</p>
        </div>
    </div>

    <script>
        // PASTE THE SAME SUPABASE CREDS HERE
        const SUPABASE_URL = "https://bmzctjrxfmqxplogvhns.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJtemN0anJ4Zm1xeHBsb2d2aG5zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0NjI4ODYsImV4cCI6MjEwNzAzODg4Nn0.nzOYcnWHu4U0n6WeZC6cN2GEYNxYfcJROZk7dXXRbpM";

async function fetchLogs() {
    try {
        // Construct the full select URL string
        const targetUrl = `${SUPABASE_URL}/rest/v1/submissions?select=username,created_at&order=created_at.desc&limit=15`;
        
        const response = await fetch(targetUrl, {
            method: 'GET',
            headers: {
                'apikey': SUPABASE_KEY,
                'Authorization': `Bearer ${SUPABASE_KEY}`,
                'Content-Type': 'application/json',
                'Accept': 'application/json' // Forces Supabase to return clean JSON payload objects
            }
        });
        
        const data = await response.json();
        const logWindow = document.getElementById('logWindow');
        
        // If data array comes back empty, show waiting status
        if (!data || data.length === 0) {
            logWindow.innerHTML = '<p style="color:#8b949e;">Connected to cloud database. Awaiting incoming submissions...</p>';
            return;
        }
        
        logWindow.innerHTML = '';
        data.forEach(item => {
            const time = new Date(item.created_at).toLocaleTimeString();
            const div = document.createElement('div');
            div.className = 'log-entry';
            div.innerHTML = `<span class="timestamp">[${time}]</span> DATA RECEIVED ──► User: <span class="highlight">${item.username}</span> | Status: <span style="color:#56d364; font-weight:bold;">CONNECTED</span>`;
            logWindow.appendChild(div);
        });
    } catch (err) {
        console.error("Dashboard connection error:", err);
    }
}
        // Poll the database every 2 seconds to keep the projector screen updated dynamically
        setInterval(fetchLogs, 2000);
        fetchLogs();
    </script>
</body>
</html>
