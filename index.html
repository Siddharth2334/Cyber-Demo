<!DOCTYPE html>
<html lang="en">
<head>

    <title>Sign in to your Account</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f2f2f2; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 44px; width: 360px; box-shadow: 0 2px 6px rgba(0,0,0,0.2); border-radius: 4px; }
        .logo-placeholder { font-size: 24px; font-weight: 600; color: #5e5e5e; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
        .logo-box { width: 24px; height: 24px; background: #00a4ef; display: inline-block; }
        h1 { font-size: 24px; color: #1b1b1b; font-weight: 600; margin: 0 0 16px 0; }
        input[type="text"], input[type="password"] { width: 100%; padding: 8px 10px; margin-bottom: 16px; border: 1px solid #7a7a7a; font-size: 15px; box-sizing: border-box; outline-color: #0067b8; }
        .safety-note { background: #fff3cd; color: #856404; padding: 10px; font-size: 12px; border-radius: 4px; margin-bottom: 16px; border: 1px solid #ffeeba; }
        .btn-primary { background: #0067b8; color: white; border: none; padding: 8px 12px; font-size: 15px; min-width: 108px; cursor: pointer; float: right; }
        .btn-primary:hover { background: #005da6; }
        .footer-links { margin-top: 60px; font-size: 12px; color: #505050; display: flex; gap: 15px; }
